name: Scrape Email Dikmen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download previous progress
        continue-on-error: true
        run: |
          # Ambil progress dari branch progress jika ada
          git fetch origin progress 2>/dev/null && \
          git checkout origin/progress -- data_dikmen_email.csv scrape_email_progress.json 2>/dev/null && \
          echo "Progress ditemukan, melanjutkan..." && \
          cat scrape_email_progress.json || \
          echo "Belum ada progress sebelumnya, mulai dari awal."

      - name: Run scraper
        run: python scrape_email_dikmen.py

      - name: Save progress to branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B progress
          git add -f data_dikmen_email.csv
          # file progress terhapus saat scraping tuntas -> jangan gagalkan step
          git add -f scrape_email_progress.json || true
          git commit -m "Update progress $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push origin progress --force

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-hasil
          path: |
            data_dikmen_email.csv
            scrape_email_progress.json
          overwrite: true
